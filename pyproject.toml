[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collabx"
version = "1.0.0"
description = "CollabX: Orchestrated Multi-Agent Newsletter & Report Team Framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CollabX Media Systems", email = "editorial@collabx.dev" }]
keywords = ["multi-agent-team", "newsletter-agents", "editorial-workflow", "langgraph-collaboration", "automated-publishing"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
