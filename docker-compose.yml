version: '3.8'

services:
  collabx-gateway:
    build: .
    container_name: collabx-gateway
    ports:
      - "8014:8014"
    environment:
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8014/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always
